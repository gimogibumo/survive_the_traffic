spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: survive_the_traffic

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}


  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketing}
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD:ticketing}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      minimum-idle: ${HIKARI_MIN_IDLE:2}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

logging:
  level:
    org.hibernate.SQL: debug

server:
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
    accept-count: 300

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
app:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:5173}

queue:
  admission:
    bypass-concert-id: ${QUEUE_ADMISSION_BYPASS_CONCERT_ID:0}
  admission-worker:
    enabled: ${QUEUE_ADMISSION_WORKER_ENABLED:false}
