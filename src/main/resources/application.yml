spring:
  application:
    name: survive_the_traffic

  data:
    redis:
        host: localhost
        port: 6379


  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing
    username: ticketing
    password: ticketing
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

logging:
  level:
    org.hibernate.SQL: debug

server:
  tomcat:
    mbeanregistry:
      enabled: true
    threads:
      max: ${TOMCAT_MAX_THREADS:200}
    accept-count: 300

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
app:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:5173}