services:
  postgres:
    image: postgres:17
    container_name: ticketing-postgres

    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing

    ports:
      - "5432:5432"

    volumes:
      - ticketing-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  redis:
    image: redis:7
    container_name: ticketing-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  ticketing-postgres-data: