services:
  postgres:
    image: postgres:17
    container_name: ticketing-postgres

    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing

    ports:
      - "5432:5432"

    volumes:
      - ticketing-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  redis:
    image: redis:7
    container_name: ticketing-redis
    ports:
      - "6379:6379"

    volumes:
      - ticketing-postgres-data:/data

    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: survive-the-traffic:local

    container_name: ticketing-app

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ticketing
      DB_USERNAME: ticketing
      DB_PASSWORD: ticketing

      REDIS_HOST: redis
      REDIS_PORT: 6379

      QUEUE_ADMISSION_WORKER_ENABLED: "false"

      HIKARI_MAX_POOL_SIZE: 10
      HIKARI_MIN_IDLE: 2

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

  queue-worker:
    image: survive-the-traffic:local
    container_name: ticketing-queue-worker
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ticketing
      DB_USERNAME: ticketing
      DB_PASSWORD: ticketing

      REDIS_HOST: redis
      REDIS_PORT: 6379

      QUEUE_ADMISSION_WORKER_ENABLED: "true"
      SPRING_MAIN_WEB_APPLICATION_TYPE: "none"

      HIKARI_MAX_POOL_SIZE: 2
      HIKARI_MIN_IDLE: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

volumes:
  ticketing-postgres-data:
  ticketing-redis-data: