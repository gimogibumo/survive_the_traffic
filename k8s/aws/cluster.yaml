apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: survive-traffic
  region: ap-northeast-2
  version: "1.37"

vpc:
  nat:
    gateway: Disable

  clusterEndpoints:
    publicAccess: true
    privateAccess: true

iam:
  withOIDC: true

managedNodeGroups:
  - name: ticketing-arm
    instanceType: t4g.medium

    desiredCapacity: 1
    minSize: 1
    maxSize: 1

    privateNetworking: false

    volumeSize: 30

    labels:
      workload: ticketing

    tags:
      project: survive-the-traffic
      environment: portfolio
