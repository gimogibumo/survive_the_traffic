apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-api
  namespace: ticketing

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ticketing-api

  template:
    metadata:
      labels:
        app: ticketing-api

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: ticketing-api
          image: 248189924429.dkr.ecr.ap-northeast-2.amazonaws.com/survive-the-traffic:phase7-20261022-115720
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "1Gi"

          envFrom:
            - configMapRef:
                name: ticketing-config

            - secretRef:
                name: ticketing-secret

          env:
            - name: APP_ROLE
              value: api

            - name: QUEUE_ADMISSION_WORKER_ENABLED
              value: "false"

            - name: SPRING_FLYWAY_ENABLED
              value: "false"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: ticketing-api
  namespace: ticketing

spec:
  type: ClusterIP

  selector:
    app: ticketing-api

  ports:
    - name: http
      port: 8080
      targetPort: 8080