apiVersion: batch/v1
kind: Job
metadata:
  name: ticketing-db-migration
  namespace: ticketing

spec:
  backoffLimit: 1

  template:
    metadata:
      labels:
        app: ticketing-db-migration

    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: 248189924429.dkr.ecr.ap-northeast-2.amazonaws.com/survive-the-traffic:phase7-20261022-115720
          imagePullPolicy: IfNotPresent

          env:
            - name: APP_ROLE
              value: migration

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: ticketing-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: ticketing-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: ticketing-config
                  key: DB_NAME

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ticketing-secret
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticketing-secret
                  key: DB_PASSWORD